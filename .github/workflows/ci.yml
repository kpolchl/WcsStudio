name: CI

on:
    pull_request:
        branches: ["master"]
    push:
        branches: ["master"]
    workflow_dispatch:

# Cancel superseded runs on the same branch/PR
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

env:
    MIX_ENV: test
    # Keep these in sync with mix.exs / .tool-versions / your Dockerfile
    ELIXIR_VERSION: "1.18.4"
    OTP_VERSION: "27.3.4"

jobs:
    test:
        name: Build and test
        runs-on: ubuntu-latest
        timeout-minutes: 15

        services:
            postgres:
                image: postgres:15-alpine # same major version as production
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - uses: actions/checkout@v5

            - name: Set up Elixir
              id: beam
              uses: erlef/setup-beam@v1
              with:
                  elixir-version: ${{ env.ELIXIR_VERSION }}
                  otp-version: ${{ env.OTP_VERSION }}
                  version-type: strict

            - name: Restore deps and build cache
              uses: actions/cache@v4
              with:
                  path: |
                      deps
                      _build
                  key: mix-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
                  restore-keys: |
                      mix-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

            - name: Install dependencies
              run: mix deps.get

            - name: Check for unused dependencies
              run: mix deps.unlock --check-unused

            - name: Check formatting
              run: mix format --check-formatted

            - name: Compile (warnings as errors)
              run: mix compile --warnings-as-errors

            - name: Audit for retired packages
              run: mix hex.audit

            - name: Credo
              run: mix credo --strict

            - name: Run tests
              run: mix test
              # Assumes config/test.exs connects to localhost as postgres/postgres.
              # If it reads DATABASE_URL instead, add:
              # env:
              #   DATABASE_URL: ecto://postgres:postgres@localhost:5432/wcs_studio_test

    security:
        name: Sobelow security scan
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            security-events: write # required to upload SARIF
            actions: read
        steps:
            - uses: actions/checkout@v5

            - id: run-action
              uses: sobelow/action@1afd6d2cae70ae8bd900b58506f54487ed863912

            - name: Upload report
              if: always()
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: results.sarif
